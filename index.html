<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon-180.png">
<title>옥동샵 oaktongshop — 곧 만나요</title>
<meta name="description" content="소모품이 떨어지기 전에, 미리 알려드립니다. 국내에 잘 없는 생활소모품만 고른 리필 트래커, 옥동샵. 곧 오픈합니다.">
<meta name="robots" content="noindex">
<meta property="og:title" content="옥동샵 oaktongshop — 곧 만나요">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:#fbfbfd;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
  .box{position:relative;max-width:540px}
  .eyebrow{font-size:13px;letter-spacing:4px;color:#86868b;text-transform:uppercase}
  h1{font-size:clamp(34px,7vw,54px);font-weight:900;margin:16px 0 12px;letter-spacing:-1.2px;line-height:1.12}
  p.t{font-size:clamp(15px,2.4vw,19px);color:#86868b}
  .badge{display:inline-block;margin-top:26px;font-size:14px;color:#0071e3;border:1px solid #d2d2d7;background:#f5f5f7;border-radius:999px;padding:8px 18px;font-weight:700}
  form{display:flex;gap:10px;max-width:420px;margin:30px auto 0}
  input{flex:1;background:#fff;border:1px solid #d2d2d7;border-radius:999px;padding:14px 20px;color:#1d1d1f;font-size:15px}
  button{background:#0071e3;color:#fff;border:none;border-radius:999px;padding:14px 22px;font-weight:800;font-size:15px;cursor:pointer}
  .ok{color:#0071e3;margin-top:14px;font-weight:700;display:none}
  .sns{margin-top:28px;color:#86868b;font-size:14px}.sns a{color:#3d4a45;text-decoration:none;margin:0 8px}
</style></head>
<body>
  <div class="box">
    <div class="eyebrow">OAKTONGSHOP · 리필 트래커</div>
    <h1>떨어지기 전에<br>미리 알려드려요.</h1>
    <p class="t">국내에 잘 없는 생활소모품만 골라, 쓰기 시작한 날부터 소진 시점을 계산해드립니다.</p>
    <div class="badge">🚀 오픈 준비 중</div>
    <form onsubmit="event.preventDefault();this.querySelector('.ok').style.display='block';this.querySelector('input').value='';">
      <input type="email" placeholder="이메일 — 오픈 소식 가장 먼저 받기" required>
      <button type="submit">알림 신청</button>
      <div class="ok">✅ 신청 완료! 오픈하면 가장 먼저 알려드릴게요.</div>
    </form>
    <div class="sns">@oaktongshop · <a href="https://instagram.com/oaktongshop" target="_blank" rel="noreferrer">Instagram</a><a href="https://tiktok.com/@oaktongshop" target="_blank" rel="noreferrer">TikTok</a><a href="https://youtube.com/@oaktongshop" target="_blank" rel="noreferrer">YouTube</a></div>
  </div>
</body></html>
