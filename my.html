  <script>
  (function(){
    var PRODUCTS = [{"slug":"sheet-laundry","name":"무포장 고농축 세탁시트 (60매)","icon":"🧺","image":"sheet-laundry.jpg","price":"₩24,900","usageDays":60,"category":"세탁"},{"slug":"wool-nuts","name":"울·니트 전용 소프넛 워시 (500ml)","icon":"🌰","price":"₩19,900","usageDays":90,"category":"세탁"},{"slug":"shampoo-bar","name":"고체 샴푸바 (95g)","icon":"🧼","image":"shampoo-bar.jpg","price":"₩16,900","usageDays":70,"category":"욕실"},{"slug":"handwash-tab","name":"핸드워시 리필 정제 (10정)","icon":"💧","price":"₩14,900","usageDays":50,"category":"욕실"},{"slug":"dish-tab","name":"식기세척기 무포장 정제 (40정)","icon":"🍽️","price":"₩21,900","usageDays":40,"category":"주방"},{"slug":"kitchen-refill","name":"주방세제 고농축 리필 파우치 (500ml)","icon":"🫧","price":"₩13,900","usageDays":45,"category":"주방"}];
    var LEAD = 21, WARN = 10;
    var list = document.getElementById('list');
    function load(){ try { return JSON.parse(localStorage.getItem('oaktong_refill_log')||'{}'); } catch(e){ return {}; } }
    function save(log){ try { localStorage.setItem('oaktong_refill_log', JSON.stringify(log)); } catch(e){} }
    function render(){
      var log = load();
      var slugs = Object.keys(log);
      if(!slugs.length){
        list.innerHTML = '<div class="empty"><p>아직 추적 중인 물건이 없어요.<br>쇼핑에서 상품을 고르고 "사용 시작"을 눌러보세요.</p><a class="btn" href="shop.html">🛍️ 쇼핑 둘러보기</a></div>';
        return;
      }
      var rows = slugs.map(function(slug){
        var p = PRODUCTS.find(function(x){return x.slug===slug;});
        if(!p) return null;
        var days = log[slug].days || p.usageDays;
        var started = new Date(log[slug].startedAt);
        var elapsed = Math.floor((Date.now()-started.getTime())/86400000);
        var remaining = days - elapsed;
        var pct = Math.max(0, Math.min(100, elapsed/days*100));
        return { slug:slug, p:p, remaining:remaining, pct:pct };
      }).filter(Boolean).sort(function(a,b){return a.remaining-b.remaining;});
      list.innerHTML = rows.map(function(r){
        var badge = r.remaining<=WARN ? '<span class="badge" style="background:#F8E4E2;color:var(--red)">🔴 '+Math.max(0,r.remaining)+'일 남음</span>'
          : r.remaining<=LEAD ? '<span class="badge" style="background:#FBEBD8;color:var(--amber)">🟡 '+r.remaining+'일 남음</span>'
          : '<span class="badge" style="background:var(--mint);color:var(--teal)">🟢 '+r.remaining+'일 남음</span>';
        var img = r.p.image ? '<img src="assets/products/'+r.p.image+'" alt="">' : r.p.icon;
        return '<div class="item"><div class="ico">'+img+'</div><div class="body"><div class="row1"><b>'+r.p.name+'</b>'+badge+'</div>'+
          '<div class="bar"><i style="width:'+r.pct+'%"></i></div>'+
          '<div class="row2"><a href="item-'+r.slug+'.html">재구매하기 →</a><button class="restart" data-slug="'+r.slug+'">다 썼어요, 새로 시작</button></div></div></div>';
      }).join('');
    }
    list.addEventListener('click', function(e){
      var b = e.target.closest('.restart'); if(!b) return;
      var log = load();
      if(log[b.dataset.slug]) log[b.dataset.slug].startedAt = new Date().toISOString();
      save(log); render();
    });
    render();
  })();
  </script>

<script>
(function(){
  var root=document.getElementById('okc'),fab=document.getElementById('okc-fab'),panel=document.getElementById('okc-panel'),
      log=document.getElementById('okc-log'),form=document.getElementById('okc-form'),input=document.getElementById('okc-in'),
      xb=document.getElementById('okc-x'),fabi=document.getElementById('okc-fab-i'),chips=document.getElementById('okc-chips'),greeted=false;
  var EMAIL="oaktongshop@naver.com";
  function add(txt,who){var d=document.createElement('div');d.className='okc-msg '+(who==='me'?'okc-me':'okc-bot');d.innerHTML=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;}
  function answer(q){
    var s=(q||'').toLowerCase();
    if(/배송|언제|도착|기간|얼마나 걸|며칠|발송/.test(s))return '해외구매대행이라 결제 확인 후 <b>평균 7~14영업일</b> 걸려요. 그래서 <b>소진 예정일 최소 21일 전</b>에 재구매 알림을 드려요. 통관을 위해 <b>개인통관고유부호</b>가 꼭 필요해요.';
    if(/재구매|알림|추적|소진|내 ?물건/.test(s))return '상품 상세에서 <b>사용 시작</b>을 누르면 남은 사용기간을 계산해서 <a href="my.html">내 물건</a>에서 진행률로 보여드려요. 소진 21일 전엔 노랑, 10일 전엔 빨강 배지로 알려드립니다.';
    if(/교환|환불|반품|취소|청약|반송/.test(s))return '수령 후 <b>7일 내 청약철회</b> 가능합니다. 단순변심은 반송비 구매자 부담, <b>하자·오배송은 전액 환불·교환</b>이에요.';
    if(/관세|세금|부가세|관부가|세관/.test(s))return '판매가에 상품가·배송비·대행수수료가 포함돼요. <b>관세·부가세는 통관 시 별도 부과</b>될 수 있고, 개인통관고유부호로 수입신고됩니다.';
    if(/결제|네이버|페이|카드|스토어/.test(s))return '결제·정산·배송은 <b>네이버 스마트스토어</b>에서 안전하게 진행돼요. 상품 페이지의 구매 버튼으로 이동합니다.';
    if(/재고|오픈|언제 열|입고|품절/.test(s))return '새 발굴·재입고 소식은 SNS와 스마트스토어에서 가장 먼저 알려드려요. 아래 채널을 팔로우해 주세요.';
    if(/추천|뭐 팔|뭐팔|무슨|상품|아이템|골라/.test(s))return '<a href="shop.html">쇼핑</a>에서 세탁·욕실·주방 소모품을 <b>카테고리별</b>로 보여드려요. 다 안 팔고, 고른 것만요 🐵';
    if(/사람|상담원|전화|통화|문의|연락|고객센터|담당/.test(s))return '사람 상담은 <a href="mailto:'+EMAIL+'">'+EMAIL+'</a> 또는 아래 SNS DM으로 남겨주세요. 운영시간에 확인해 답변드려요.';
    if(/안녕|하이|반가/.test(s))return '안녕하세요! 옥동샵 안내봇이에요 🐵 배송·재구매 알림·상품 뭐든 물어보세요.';
    return '제가 아직 못 배운 질문이에요. 아래 <b>빠른 버튼</b>을 눌러보거나, 자세한 문의는 <a href="mailto:'+EMAIL+'">'+EMAIL+'</a> 로 주시면 확인해 답변드릴게요.';
  }
  function botSay(q){setTimeout(function(){add(answer(q),'bot');},260);}
  function open(){root.dataset.open='1';panel.hidden=false;fab.setAttribute('aria-expanded','true');fabi.textContent='✕';
    if(!greeted){greeted=true;add('안녕하세요, 옥동샵 안내봇이에요 🐵<br>배송·재구매 알림·상품은 자동으로 답해드리고, 사람 상담은 이메일·SNS로 연결해 드려요.','bot');}
    setTimeout(function(){input.focus();},50);}
  function close(){root.dataset.open='0';panel.hidden=true;fab.setAttribute('aria-expanded','false');fabi.textContent='💬';}
  fab.addEventListener('click',function(){root.dataset.open==='1'?close():open();});
  xb.addEventListener('click',close);
  form.addEventListener('submit',function(e){e.preventDefault();var q=input.value.trim();if(!q)return;add(q,'me');input.value='';botSay(q);});
  chips.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;add(b.dataset.q,'me');botSay(b.dataset.q);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&root.dataset.open==='1')close();});
})();
</script></body>
